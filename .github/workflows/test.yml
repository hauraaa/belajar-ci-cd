name: QA Automation Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js di Server
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Jalankan Unit Test QA
        run: npm test